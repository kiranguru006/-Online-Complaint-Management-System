server.port=8080
server.address=0.0.0.0

# Application Name
spring.application.name=online-complaint-management-system

# ===============================
# Database Configuration - H2 (Default for Development)
# ===============================
spring.datasource.url=jdbc:h2:mem:complaintdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# ===============================
# MySQL Configuration (Production ready - uncomment to use)
# ===============================
# spring.datasource.url=jdbc:mysql://localhost:3306/complaint_system_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ===============================
# JWT Security Configuration
# ===============================
app.jwt.secret=complaintManagementSystemSuperSecretKeyWithAtLeast256BitsLengthForHmacSha2026!
app.jwt.expiration-ms=86400000

# Optional Email Notification Configuration (Disabled by default)
app.mail.enabled=false
